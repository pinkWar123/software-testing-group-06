[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html=report.html --self-contained-html
markers =
    domain: Domain Testing test cases (FR-02)
    bva: Boundary Value Analysis test cases (FR-02)
    constraints: Best-practice constraint test cases (FR-02)
    slow: Tests that involve time delays
    cart_domain: Domain Testing test cases (FR-07 Shopping Cart)
    cart_bva: Boundary Value Analysis test cases (FR-07 Shopping Cart)
    coupon_ui: UI test cases for FR-17 Coupon Management (admin panel)
    mobile_quantity: Selenium cases for Feature D mobile quantity input via Expo web
